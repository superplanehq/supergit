version: v1.0
name: "Release supergit"

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204

global_job_config:
  env_vars:
    - name: DOCKER_BUILDKIT
      value: "1"
    - name: SUPERGIT_IMAGE_REPO
      value: "ghcr.io/superplanehq/supergit"

  secrets:
    - name: ghcr-push-token
    - name: github-release-token

  prologue:
    commands:
      - checkout
      - |
        if [ -z "$SEMAPHORE_GIT_TAG_NAME" ]; then
          echo "Release pipeline requires a Git tag"
          exit 1
        fi
      - echo "$GHCR_PUSH_TOKEN" | docker login ghcr.io -u superplanehq --password-stdin

blocks:
  - name: "amd64 Image"
    dependencies: []
    task:
      agent:
        machine:
          type: f1-standard-2
          os_image: ubuntu2204

      jobs:
        - name: "Build"
          commands:
            - bash scripts/build-image.sh "${SEMAPHORE_GIT_TAG_NAME#v}" "amd64"

  - name: "arm64 Image"
    dependencies: []
    task:
      agent:
        machine:
          type: r1-standard-4
          os_image: ubuntu2404

      jobs:
        - name: "Build"
          commands:
            - bash scripts/build-image.sh "${SEMAPHORE_GIT_TAG_NAME#v}" "arm64"

  - name: "Build Multi-Platform Manifest"
    dependencies: ["amd64 Image", "arm64 Image"]
    task:
      jobs:
        - name: "Create and Push Manifest"
          commands:
            - export IMAGE_TAG="${SEMAPHORE_GIT_TAG_NAME#v}"
            - docker manifest create "$SUPERGIT_IMAGE_REPO:$IMAGE_TAG" "$SUPERGIT_IMAGE_REPO:$IMAGE_TAG-amd64" "$SUPERGIT_IMAGE_REPO:$IMAGE_TAG-arm64"
            - docker manifest push "$SUPERGIT_IMAGE_REPO:$IMAGE_TAG"

  - name: "Verify Image"
    dependencies: ["Build Multi-Platform Manifest"]
    task:
      jobs:
        - name: "Verify GHCR Image"
          commands:
            - docker manifest inspect "$SUPERGIT_IMAGE_REPO:${SEMAPHORE_GIT_TAG_NAME#v}"

  - name: "GitHub Release"
    dependencies: ["Verify Image"]
    task:
      jobs:
        - name: "GoReleaser"
          commands:
            - sem-version go 1.26.2
            - curl -sfL "https://github.com/goreleaser/goreleaser/releases/download/v2.16.0/goreleaser_Linux_x86_64.tar.gz" | tar -xz goreleaser
            - chmod +x goreleaser
            - export GITHUB_TOKEN="$GITHUB_RELEASE_TOKEN"
            - ./goreleaser release --clean
