version: v1.0
name: "Build and Push supergit Image"

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204

global_job_config:
  env_vars:
    - name: DOCKER_BUILDKIT
      value: "1"
    - name: SUPERGIT_IMAGE_REPO
      value: "ghcr.io/superplanehq/supergit"

  secrets:
    - name: ghcr-push-token

  prologue:
    commands:
      - checkout
      - |
        if [ -z "$SEMAPHORE_GIT_TAG_NAME" ]; then
          echo "Release pipeline requires a Git tag"
          exit 1
        fi
      - echo "IMAGE_TAG=${SEMAPHORE_GIT_TAG_NAME#v}" >> "$SEMAPHORE_ENV_FILE"
      - echo "$GHCR_PUSH_TOKEN" | docker login ghcr.io -u superplanehq --password-stdin

blocks:
  - name: "amd64 Image"
    dependencies: []
    task:
      agent:
        machine:
          type: f1-standard-2
          os_image: ubuntu2204

      jobs:
        - name: "Build"
          commands:
            - bash scripts/build-image.sh "$IMAGE_TAG" "amd64"

  - name: "arm64 Image"
    dependencies: []
    task:
      agent:
        machine:
          type: r1-standard-4
          os_image: ubuntu2404

      jobs:
        - name: "Build"
          commands:
            - bash scripts/build-image.sh "$IMAGE_TAG" "arm64"

  - name: "Build Multi-Platform Manifest"
    dependencies: ["amd64 Image", "arm64 Image"]
    task:
      jobs:
        - name: "Create and Push Manifest"
          commands:
            - docker manifest create "$SUPERGIT_IMAGE_REPO:$IMAGE_TAG" "$SUPERGIT_IMAGE_REPO:$IMAGE_TAG-amd64" "$SUPERGIT_IMAGE_REPO:$IMAGE_TAG-arm64"
            - docker manifest push "$SUPERGIT_IMAGE_REPO:$IMAGE_TAG"

  - name: "Verify Image"
    dependencies: ["Build Multi-Platform Manifest"]
    task:
      jobs:
        - name: "Verify GHCR Image"
          commands:
            - docker manifest inspect "$SUPERGIT_IMAGE_REPO:$IMAGE_TAG"
