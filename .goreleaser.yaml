version: 2

project_name: supergit

before:
  hooks:
    - go mod tidy

builds:
  - id: supergit
    main: ./cmd/supergit
    binary: supergit
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    formats:
      - binary
    name_template: "supergit-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  github:
    owner: superplanehq
    name: supergit
  name_template: "{{ .Tag }}"

changelog:
  disable: true
